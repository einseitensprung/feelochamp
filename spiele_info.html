<!DOCTYPE html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feelochamp &ndash; Spiel-Info</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/bootstrap.min.css">
<link rel="stylesheet" href="assets/main.css">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

<!-- Eigenstaendige Seite fuer die Info-Lightbox der Spiele-Seite: kein Navbar,
     kein Footer. Inhalt entspricht spiele_info.asp?id=1 (Tipp-Uebersicht je Spiel),
     die echten Vereinswappen sind durch die Initialen-Badges ersetzt. -->
<body class="page-info">
<main class="info-wrap">
  <div class="info-head">
    <span class="eyebrow">Gruppe A &middot; Matchday 1</span>
    <div class="info-teams">
      <span class="crest" style="background:#123a8f; color:#fff;">CLB</span>
      <span class="info-team-name">Club Br&uuml;gge</span>
      <span class="info-vs">:</span>
      <span class="info-team-name">Aston Villa</span>
      <span class="crest" style="background:#7a1f3d; color:#fff;">AVL</span>
    </div>
  </div>

  <table class="info-table">
    <thead>
      <tr>
        <th>User</th>
        <th>Tipp</th>
        <th>Ergebnis</th>
        <th>Datum</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>herwig</td>
        <td><span class="info-pick">1</span></td>
        <td class="info-muted">&ndash;</td>
        <td class="info-muted">02.09.2026 10:19:36</td>
      </tr>
      <tr>
        <td>sTe</td>
        <td><span class="info-pick">X</span></td>
        <td class="info-muted">&ndash;</td>
        <td class="info-muted">01.09.2026 20:21:18</td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
